name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Frontmatter, descriptions, openai.yaml, docs pages, links, catalogs,
      # plugin manifest coverage, and plugin/package version sync.
      # bash and jq are preinstalled on GitHub-hosted Ubuntu runners.
      - name: Validate skills
        run: bash scripts/validate-skills.sh
